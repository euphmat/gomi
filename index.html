<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- Error Handling / Modal -->
  <script>
    (function() {
      const displayModal = function(msg) {
        if (document.getElementById('error-report-modal')) return;

        const overlay = document.createElement('div');
        overlay.id = 'error-report-modal';
        // Inline styles to ensure it works even if CSS/Tailwind is broken
        overlay.style.cssText = 'position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.8); backdrop-filter:blur(4px); padding:20px; font-family:sans-serif;';

        const modal = document.createElement('div');
        modal.style.cssText = 'background:#1f2937; border:1px solid #374151; border-radius:12px; padding:20px; width:100%; max-width:500px; color:#f3f4f6; box-shadow:0 25px 50px -12px rgba(0,0,0,0.5); display:flex; flex-direction:column; gap:16px;';

        modal.innerHTML = `
          <h2 style="margin:0; color:#ef4444; font-size:1.25rem; font-weight:bold; display:flex; align-items:center; gap:8px;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            エラーが発生しました
          </h2>
          <p style="margin:0; font-size:0.875rem; color:#9ca3af; line-height:1.5;">
            予期せぬエラーにより、ゲームが停止した可能性があります。お手数ですが、以下のエラー内容をコピーして開発者にご報告ください。
          </p>
          <div style="background:#111827; border:1px solid #374151; border-radius:6px; padding:12px; max-height:150px; overflow-y:auto;">
            <pre id="error-content" style="margin:0; font-size:0.75rem; color:#d1d5db; white-space:pre-wrap; word-break:break-all; font-family:monospace;"></pre>
          </div>
          <div style="display:flex; gap:12px; justify-content:flex-end; margin-top:8px;">
            <button id="btn-error-reload" style="padding:8px 16px; border-radius:6px; border:1px solid #4b5563; background:#374151; color:#f3f4f6; cursor:pointer; font-size:0.875rem; font-weight:bold; display:flex; align-items:center; gap:6px;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 1 0 2.6-6.4L2 12"/></svg>
              ハードリフレッシュ
            </button>
            <button id="btn-error-copy" style="padding:8px 16px; border-radius:6px; border:none; background:#3b82f6; color:#ffffff; cursor:pointer; font-size:0.875rem; font-weight:bold; display:flex; align-items:center; gap:6px;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              エラーをコピー
            </button>
          </div>
        `;

        overlay.appendChild(modal);
        if (document.body) {
          document.body.appendChild(overlay);
        } else {
          document.addEventListener('DOMContentLoaded', () => document.body.appendChild(overlay));
        }

        document.getElementById('error-content').textContent = msg;

        const copyBtn = document.getElementById('btn-error-copy');
        copyBtn.addEventListener('click', async function() {
          try {
            await navigator.clipboard.writeText(msg);
            const originalBg = this.style.background;
            this.textContent = 'コピー完了！';
            this.style.background = '#10b981';
            setTimeout(() => {
              this.textContent = 'コピー';
              this.style.background = originalBg;
            }, 2000);
          } catch(err) {
            alert('クリップボードへのコピーに失敗しました。');
          }
        });

        document.getElementById('btn-error-reload').addEventListener('click', async function() {
          try {
            if ('serviceWorker' in navigator) {
              const regs = await navigator.serviceWorker.getRegistrations();
              for (let reg of regs) { await reg.unregister(); }
            }
            if ('caches' in window) {
              const keys = await caches.keys();
              for (let key of keys) { await caches.delete(key); }
            }
          } catch(err) { console.error('Recovery clear failed', err); }
          window.location.reload(true);
        });
      };

      const handleError = function(e) {
        let errorMsg = 'Unknown Error';
        if (e.error) {
          errorMsg = e.error.stack || e.error.message;
        } else if (e.reason) {
          errorMsg = e.reason.stack || e.reason.message || String(e.reason);
        } else {
          errorMsg = e.message || String(e);
        }
        
        // Skip benign errors
        if (typeof errorMsg === 'string' && errorMsg.includes('ResizeObserver loop')) return;

        displayModal(errorMsg);
      };

      window.addEventListener('error', handleError);
      window.addEventListener('unhandledrejection', handleError);
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="RPG Game - Status Screen">
  <meta name="theme-color" content="#0b0b19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>RPG Game</title>

  <!-- PWA Manifest & App Icons -->
  <link rel="icon" type="image/x-icon" href="./assets/icons/favicon.ico">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192x192.png">

  <!-- TailwindCSS v4 Browser CDN -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Monster Tower physics (the game has a built-in offline fallback) -->
  <script id="matter-js-runtime"
          defer
          src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"
          integrity="sha384-ZRKYEXtLBVeqs9z1WxyeKutCqnkqolS/r1EUWuoUpG4ZKbnRAIXnHhHdnNuiB6CL"
          crossorigin="anonymous"
          onload="this.dataset.ready='true'"
          onerror="this.dataset.ready='error'"></script>

  <!-- Google Fonts: DotGothic16 + Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=DotGothic16&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

  <!-- Tailwind v4 Theme + Custom Styles -->
  <style type="text/tailwindcss">
    /* ─── Custom Theme ──────────────────────────────── */
    @theme {
      --font-sans: 'DotGothic16', system-ui, sans-serif;
    }

    @keyframes rainbow-hue {
      from { filter: hue-rotate(0deg); }
      to { filter: hue-rotate(360deg); }
    }
    .animate-rainbow {
      animation: rainbow-hue 2s linear infinite;
    }

    @keyframes update-ready-glow {
      0%, 100% { box-shadow: 0 0 8px rgba(250, 204, 21, .45), 0 0 18px rgba(34, 211, 238, .18); filter: brightness(1); }
      50% { box-shadow: 0 0 14px rgba(250, 204, 21, .9), 0 0 28px rgba(34, 211, 238, .45); filter: brightness(1.28); }
    }
    #btn-hard-refresh.is-update-available {
      position: relative;
      border-color: rgba(253, 224, 71, .9);
      background: linear-gradient(135deg, rgba(5, 150, 105, .95), rgba(8, 145, 178, .95));
      color: white;
      animation: update-ready-glow 1.35s ease-in-out infinite;
    }
    #btn-hard-refresh.is-update-available::after {
      content: '';
      position: absolute;
      right: -3px;
      top: -3px;
      width: 7px;
      height: 7px;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 999px;
      background: #fde047;
      box-shadow: 0 0 8px #fde047;
    }

    /* ─── Base Styles ───────────────────────────────── */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    /* Full notation can be much wider than compact notation. Keep the fixed
       header controls reachable even for extremely large balances. */
    html[data-number-notation="full"] #header-wallet {
      flex: 0 1 auto;
      width: fit-content;
      max-width: 42vw;
      gap: 0.125rem;
    }
    html[data-number-notation="full"] #header-gold,
    html[data-number-notation="full"] #header-prism {
      flex: 0 1 auto;
      width: fit-content;
      max-width: calc((42vw - 0.125rem) / 2);
      padding-inline: 0.25rem;
      overflow: hidden;
    }
    html[data-number-notation="full"] #header-gold-display,
    html[data-number-notation="full"] #header-prism-display {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    button,
    [role="button"],
    [role="tab"],
    a[href],
    input,
    select {
      touch-action: manipulation;
    }

    button,
    [role="button"],
    [role="tab"] {
      -webkit-touch-callout: none;
    }

    button:not(:disabled),
    [role="button"]:not([aria-disabled="true"]),
    [role="tab"]:not([aria-disabled="true"]),
    a[href] {
      cursor: pointer;
    }

    button:disabled,
    [aria-disabled="true"] {
      cursor: not-allowed;
    }

    /* A pressed state that also survives DOM re-render timing on touch
       devices.  `scale` is kept separate from `transform`, so it does not
       overwrite positioning utilities used by cards and battle controls. */
    button:not(:disabled),
    [role="button"]:not([aria-disabled="true"]),
    [role="tab"]:not([aria-disabled="true"]),
    a[href],
    .cursor-pointer {
      transition-property: color, background-color, border-color, opacity, filter, scale, box-shadow;
      transition-duration: 120ms;
      transition-timing-function: ease-out;
    }

    .touch-pressed {
      filter: brightness(1.16) saturate(1.08);
    }

    /* Do not multiply Tailwind's existing active scale. */
    .touch-pressed:not([class*="active:scale"]) {
      scale: 0.97;
    }

    button:focus-visible,
    [role="button"]:focus-visible,
    [role="tab"]:focus-visible,
    a[href]:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid rgba(103, 232, 249, 0.95);
      outline-offset: 2px;
    }

    /* Finger-first controls. Frequently used actions get the comfortable
       44px target recommended for touch; compact header utilities are still
       at least 40px and have separation from adjacent controls. */
    @media (pointer: coarse) {
      button:not([class*="w-"]),
      [role="button"]:not([class*="w-"]),
      [role="tab"]:not([class*="w-"]) {
        min-width: 44px;
      }

      button:not([class*="h-"]),
      [role="button"]:not([class*="h-"]),
      [role="tab"]:not([class*="h-"]) {
        min-height: 44px;
      }

      .touch-compact {
        min-width: 40px;
        min-height: 40px;
      }

      button[id*="close"],
      button[class*="close"],
      button[data-close],
      button[aria-label*="閉じ"] {
        min-width: 44px;
        min-height: 44px;
      }

      input:not([type="range"]):not([type="checkbox"]):not([type="radio"]),
      select,
      textarea {
        min-height: 44px;
      }
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100lvh;
      overflow: hidden;
      background-color: #020617;
      color-scheme: dark;
      /* Keep scrolling and pinch zoom available, but disable the browser's
         double-tap-to-zoom gesture across the whole game screen. */
      touch-action: manipulation;
    }

    body {
      font-family: 'DotGothic16', system-ui, sans-serif;
      /* Match the footer so Safari can never reveal a differently coloured
         strip while its visual viewport is resizing. */
      background-color: #020617;
      color: #e5e7eb;
      margin: 0;
      padding: 0;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
      -webkit-user-select: none;
    }

    input,
    textarea,
    [contenteditable="true"] {
      user-select: text;
      -webkit-user-select: text;
    }

    /* iOS zooms the entire app when a smaller text field receives focus.
       Keep editable controls at the non-zooming size without disabling pinch
       zoom for the rest of the interface. */
    @supports (-webkit-touch-callout: none) {
      @media (max-width: 640px) {
        input:not([type="range"]):not([type="checkbox"]):not([type="radio"]),
        select,
        textarea {
          font-size: 16px !important;
        }
      }
    }

    /* ─── Subtle Grid Background ────────────────────── */
    #app {
      width: 100%;
      height: 100vh;
      /*
       * iOS Safari exposes the area behind its collapsing bottom toolbar in
       * screenshots, while 100dvh stops above that area.  Size the painted
       * app shell to the large viewport and let #game-nav absorb the part
       * which is temporarily covered by browser chrome (see below).
       */
      height: 100lvh;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    #content,
    [class*="overflow-y-auto"] {
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }

    #content {
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }

    .no-scrollbar {
      scrollbar-width: none;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .custom-scrollbar {
      scrollbar-width: thin;
      scrollbar-color: rgba(148, 163, 184, 0.28) transparent;
    }

    [role="tablist"] {
      scroll-snap-type: x proximity;
      overscroll-behavior-x: contain;
    }
    [role="tablist"] > [role="tab"] {
      scroll-snap-align: center;
    }

    .animate-fade-in {
      animation: fade-in 0.2s ease-out both;
    }

    /*
     * Keep the buttons in the dynamic (actually usable) viewport, but extend
     * the footer's own background to the physical bottom edge.  This removes
     * the body-coloured strip seen below the footer on iPhone Safari.  The
     * max() guard makes the rule harmless when the toolbar is collapsed or on
     * browsers where the large and dynamic viewports are identical.
     */
    #game-nav {
      box-sizing: border-box;
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-bottom: calc(
        env(safe-area-inset-bottom, 0px) +
        max(0px, calc(100lvh - 100dvh))
      );
      background-color: rgb(2 6 23);
      /* Cover sub-pixel rounding and the transient area exposed while the
         iOS Safari toolbar animates. This is paint-only and changes no layout. */
      box-shadow: 0 100px 0 100px rgb(2 6 23);
    }

    #game-header {
      padding-left: max(0.375rem, env(safe-area-inset-left, 0px));
      padding-right: max(0.375rem, env(safe-area-inset-right, 0px));
    }

    /* Keep the phone header on one compact row.  Location and balances may
       shrink, while utility buttons keep a predictable tap target. */
    @media (max-width: 480px) and (orientation: portrait) {
      #game-header {
        display: flex;
        align-items: center;
        gap: 0.25rem;
        padding-left: max(0.375rem, env(safe-area-inset-left, 0px));
        padding-right: max(0.375rem, env(safe-area-inset-right, 0px));
      }

      #header-location {
        flex: 1 1 0%;
        min-width: 0;
      }

      #header-wallet {
        display: flex;
        flex: 0 1 auto;
        min-width: 0;
        gap: 0.25rem;
      }

      #header-gold,
      #header-prism {
        flex: 0 1 auto;
        min-width: 0;
        min-height: 30px;
        padding-left: 0.375rem;
        padding-right: 0.375rem;
        justify-content: center;
        overflow: hidden;
      }

      #header-gold-display,
      #header-prism-display {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #game-header > button {
        flex: 0 0 36px;
        min-width: 36px;
        min-height: 36px;
        width: 36px;
        height: 36px;
      }

      .char-card {
        padding: 0.375rem;
      }

      .char-card .char-avatar {
        width: 3rem;
        height: 3rem;
      }
    }

    /* Short landscape screens need content more than decorative chrome. */
    @media (orientation: landscape) and (max-height: 520px) {
      #game-header {
        padding-top: max(env(safe-area-inset-top, 0px), 0.25rem);
        padding-bottom: 0.25rem;
      }

      #game-header > button {
        min-width: 36px;
        min-height: 36px;
        width: 36px;
        height: 36px;
      }

      #game-nav button {
        min-height: 46px;
        padding-block: 0.25rem;
      }

      #game-nav button .material-symbols-outlined {
        font-size: 20px;
      }
    }

    /* Modal content stays inside notches, home indicators and rounded display
       corners even when the original overlay only supplied horizontal space. */
    @media (max-width: 640px) {
      body > [class~="fixed"][class~="inset-0"][class*="items-center"] {
        padding-top: max(0.75rem, env(safe-area-inset-top, 0px));
        padding-right: max(0.75rem, env(safe-area-inset-right, 0px));
        padding-bottom: max(0.75rem, env(safe-area-inset-bottom, 0px));
        padding-left: max(0.75rem, env(safe-area-inset-left, 0px));
      }
    }

    /* Battle owns its bottom controls. Tighten the global chrome while the
       battle route is active so the scene remains usable on short phones. */
    .battle-route #game-header {
      padding-bottom: 0.375rem;
      padding-top: calc(env(safe-area-inset-top, 0px) + 0.375rem);
    }

    /* ─── Custom Scrollbar ──────────────────────────── */
    ::-webkit-scrollbar {
      width: 3px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:active {
      background: rgba(255, 255, 255, 0.25);
    }



    /* ─── Character Card Entrance ───────────────────── */
    .char-card {
      animation: card-in 0.4s ease-out both;
    }
    .char-card:nth-child(1) { animation-delay: 0.05s; }
    .char-card:nth-child(2) { animation-delay: 0.1s; }
    .char-card:nth-child(3) { animation-delay: 0.15s; }
    .char-card:nth-child(4) { animation-delay: 0.2s; }

    @keyframes card-in {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ─── Material Symbols Sizing ───────────────────── */
    .material-symbols-outlined {
      font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24;
    }

    /* ─── Modal Animations ─────────────────────────── */
    @keyframes fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes slide-up {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes shimmer {
      100% { transform: translateX(100%); }
    }

    /* ─── Battle Popups ────────────────────────────── */
    @keyframes float-popup {
      0% {
        opacity: 0;
        transform: translate(-50%, 0) scale(0.5);
      }
      10% {
        opacity: 1;
        transform: translate(calc(-50% + var(--spread-x, 0px) * 0.5), calc(var(--float-y, -25px) * 0.5)) scale(1.2);
      }
      25% {
        transform: translate(calc(-50% + var(--spread-x, 0px) * 0.8), calc(var(--float-y, -25px) * 0.8)) scale(1.0);
      }
      70% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--spread-x, 0px)), var(--float-y, -25px)) scale(1.0);
      }
    }
    .animate-float-popup {
      animation: float-popup var(--popup-dur, 1.2s) cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      will-change: transform, opacity;
    }

    @keyframes label-popup-inner {
      0% {
        opacity: 0;
        transform: scale(0.5);
      }
      15% {
        opacity: 1;
        transform: scale(1.15);
      }
      25% {
        transform: scale(1.0);
      }
      70% {
        opacity: 1;
      }
      100% {
        opacity: 0;
      }
    }
    .animate-label-popup {
      animation: label-popup-inner var(--popup-dur, 1s) ease-out forwards;
      will-change: transform, opacity;
    }

    /* ─── Inn Rest Animations ────────────────────────── */
    @keyframes inn-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .animate-inn-float {
      animation: inn-float 3s ease-in-out infinite;
    }

    @keyframes inn-pulse-glow {
      0%, 100% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.2); opacity: 0.45; }
    }
    .animate-inn-pulse-glow {
      animation: inn-pulse-glow 2.5s ease-in-out infinite;
    }

    @keyframes zzz-float-up {
      0% {
        opacity: 0;
        transform: translate(0, 0) scale(0.6);
      }
      15% {
        opacity: 0.8;
      }
      80% {
        opacity: 0.8;
      }
      100% {
        opacity: 0;
        transform: translate(var(--x-offset, 20px), -100px) scale(1.2);
      }
    }
    .animate-zzz {
      animation: zzz-float-up 2.2s ease-out forwards;
    }

    @keyframes wakeup-flash {
      0% { opacity: 0; }
      25% { opacity: 1; }
      100% { opacity: 0; }
    }
    .animate-wakeup-flash {
      animation: wakeup-flash 0.6s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }

    /* ─── Settings Modal ──────────────────────────── */
    @keyframes settings-section-in {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .settings-section {
      animation: settings-section-in 0.35s ease-out both;
    }
    .settings-section:nth-child(1) { animation-delay: 0.06s; }
    .settings-section:nth-child(2) { animation-delay: 0.12s; }
    .settings-section:nth-child(3) { animation-delay: 0.18s; }
    .settings-section:nth-child(4) { animation-delay: 0.24s; }
    .settings-section:nth-child(5) { animation-delay: 0.30s; }

    .settings-group {
      overflow: hidden;
      border: 1px solid rgba(55, 65, 81, 0.45);
      border-radius: 12px;
      background: rgba(31, 41, 55, 0.32);
    }
    .settings-compact-row {
      min-height: 50px;
      padding: 8px 10px;
      transition: background-color 0.2s ease;
    }
    .settings-compact-row + .settings-compact-row {
      border-top: 1px solid rgba(55, 65, 81, 0.38);
    }
    .settings-compact-row:active {
      background: rgba(55, 65, 81, 0.38);
    }
    .settings-compact-icon {
      display: flex;
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }

    /* Custom Toggle Switch */
    .setting-toggle {
      position: relative;
      width: 38px;
      height: 22px;
      background: #374151;
      border-radius: 11px;
      cursor: pointer;
      transition: background 0.3s ease, box-shadow 0.3s ease;
      flex-shrink: 0;
    }
    .setting-toggle::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      background: #9ca3af;
      border-radius: 50%;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s ease, box-shadow 0.3s ease;
    }
    .setting-toggle.active {
      background: var(--toggle-color, #3b82f6);
      box-shadow: 0 0 12px var(--toggle-glow, rgba(59, 130, 246, 0.4));
    }
    .setting-toggle.active::after {
      transform: translateX(16px);
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    /* Custom Range Slider */
    .setting-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 5px;
      background: #1f2937;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
      position: relative;
    }
    .setting-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      box-shadow: 0 0 10px rgba(251, 191, 36, 0.4), 0 2px 6px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .setting-slider::-webkit-slider-thumb:active {
      transform: scale(1.08);
      box-shadow: 0 0 16px rgba(251, 191, 36, 0.6), 0 2px 8px rgba(0,0,0,0.3);
    }
    .setting-slider::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      box-shadow: 0 0 10px rgba(251, 191, 36, 0.4), 0 2px 6px rgba(0,0,0,0.3);
      cursor: pointer;
    }

    /* Quantity Slider */
    .quantity-slider {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
    }
    .quantity-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #f472b6;
      border: 2.5px solid #fff;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(244, 114, 182, 0.6), 0 2px 4px rgba(0,0,0,0.3);
      transition: transform 0.1s ease;
    }
    .quantity-slider::-webkit-slider-thumb:active {
      transform: scale(1.08);
    }
    .quantity-slider::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #f472b6;
      border: 2.5px solid #fff;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(244, 114, 182, 0.6), 0 2px 4px rgba(0,0,0,0.3);
      transition: transform 0.1s ease;
      box-sizing: border-box;
    }
    .quantity-slider::-moz-range-thumb:active {
      transform: scale(1.08);
    }

    /* Speed step dots */
    .speed-step {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .speed-step::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #374151;
      transition: background 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }
    .speed-step.active::before {
      background: #fbbf24;
      box-shadow: 0 0 8px rgba(251, 191, 36, 0.5);
      transform: scale(1.2);
    }

    /* Settings action button */
    .settings-action-btn {
      position: relative;
      overflow: hidden;
      transition: all 0.2s ease;
    }
    .settings-action-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .settings-action-btn:active::before {
      opacity: 1;
    }
    .settings-action-btn:active {
      transform: scale(0.97);
    }

    /* Keep the complete settings form usable inside a phone viewport. */
    @media (max-width: 480px) {
      #settings-modal {
        padding: max(4px, env(safe-area-inset-top)) 5px max(4px, env(safe-area-inset-bottom));
      }
      .settings-modal-card {
        width: 100%;
        max-height: calc(100dvh - max(8px, env(safe-area-inset-top)) - max(8px, env(safe-area-inset-bottom)));
        margin-inline: 0;
        border-radius: 12px;
      }
      .settings-modal-header {
        padding: 6px 10px;
      }
      .settings-modal-header > .relative > div:first-child {
        gap: 7px;
      }
      .settings-modal-header > .relative > div:first-child > div:first-child {
        width: 24px;
        height: 24px;
        border-radius: 7px;
      }
      #settings-close {
        width: 28px;
        height: 28px;
        min-width: 28px;
        min-height: 28px;
      }
      .settings-modal-body {
        gap: 4px;
        padding: 5px 7px;
        overscroll-behavior: contain;
        scrollbar-width: thin;
      }
      .settings-screen-lock,
      .settings-speed-panel {
        padding: 5px 7px;
        border-radius: 9px;
      }
      #setting-screen-lock-button {
        min-height: 34px;
      }
      .settings-group {
        border-radius: 9px;
      }
      .settings-compact-row {
        min-height: 34px;
        padding: 5px 7px;
      }
      .settings-compact-row .gap-2\.5,
      .settings-screen-lock .gap-2\.5,
      .settings-speed-panel .gap-2\.5 {
        gap: 7px;
      }
      .settings-compact-icon {
        width: 22px;
        height: 22px;
        border-radius: 6px;
      }
      .settings-compact-icon .material-symbols-outlined {
        font-size: 13px;
      }
      .settings-row-description {
        display: none;
      }
      .settings-section-label {
        min-height: 11px;
        font-size: 7px;
        line-height: 1;
      }
      .settings-section-label .material-symbols-outlined {
        font-size: 10px;
      }
      .setting-toggle {
        width: 32px;
        height: 18px;
      }
      .setting-toggle::after {
        top: 2px;
        left: 2px;
        width: 14px;
        height: 14px;
      }
      .setting-toggle.active::after {
        transform: translateX(14px);
      }
      #setting-number-notation .number-notation-option {
        min-width: 2.75rem;
        padding-block: 3px;
      }
      .settings-speed-panel > .flex:first-child {
        margin-bottom: 2px;
      }
      .settings-speed-panel > .px-1 {
        padding-bottom: 0;
      }
      .setting-slider::-webkit-slider-thumb {
        width: 14px;
        height: 14px;
      }
      .setting-slider::-moz-range-thumb {
        width: 14px;
        height: 14px;
      }
      .speed-step {
        gap: 1px;
      }
      .speed-step::before {
        width: 6px;
        height: 6px;
      }
      #cloud-save-panel > .flex {
        gap: 7px;
      }
      #cloud-save-status {
        display: -webkit-box;
        margin-top: 1px;
        overflow: hidden;
        font-size: 7px;
        line-height: 1.2;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      #cloud-signed-out,
      #cloud-signed-in,
      #cloud-config-required {
        margin-top: 4px;
      }
      #cloud-signed-out,
      #cloud-signed-in {
        row-gap: 4px;
      }
      #cloud-signed-out > * + *,
      #cloud-signed-in > * + * {
        margin-block-start: 4px;
        margin-block-end: 0;
      }
      #cloud-signed-out input {
        min-height: 26px;
        padding: 3px 7px;
      }
      #cloud-signed-out .settings-action-btn,
      #cloud-signed-in .settings-action-btn {
        min-height: 26px;
        padding-block: 3px;
      }
      #cloud-save-panel button {
        min-height: 26px;
      }
      #cloud-signed-in > div:first-child,
      #cloud-auto-save-state {
        padding: 4px 7px;
        border-radius: 7px;
      }
      #cloud-auto-save-state {
        gap: 6px;
      }
      #cloud-auto-save-state > .material-symbols-outlined {
        font-size: 14px;
      }
      #cloud-auto-save-detail {
        display: none;
      }
      .settings-cloud-note {
        display: none;
      }
      #settings-reset {
        min-height: 28px;
        padding: 4px 7px;
      }
    }

    @media (max-width: 480px) and (max-height: 680px) {
      .settings-modal-body {
        gap: 3px;
        padding-block: 4px;
      }
      .settings-compact-row {
        min-height: 32px;
        padding-block: 4px;
      }
      .settings-screen-lock,
      .settings-speed-panel {
        padding-block: 4px;
      }
      #setting-screen-lock-button {
        min-height: 32px;
      }
      #cloud-last-upload {
        display: none;
      }
    }

    /* ─── Reduced Motion Preference ────────────────── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
      .animate-pulse { animation: none !important; }
      .animate-inn-float { animation: none !important; }
      .animate-inn-pulse-glow { animation: none !important; }
      .animate-zzz { animation: none !important; }
      .animate-wakeup-flash { animation: none !important; }
      .settings-section { animation: none !important; }
      #btn-hard-refresh.is-update-available { animation: none !important; }

      .touch-pressed {
        scale: 1;
      }
    }
  </style>

  <!-- Service Worker Cleanup (unregister legacy SW) -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        registrations.forEach(registration => {
          registration.unregister().then(success => {
            if (success) console.log('SW unregistered successfully');
          });
        });
      });
      caches.keys().then(names => {
        names.forEach(name => caches.delete(name));
      });
    }
  </script>

  <!-- App Module -->
  <script type="module" src="./js/app.js"></script>
