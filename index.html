<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="RPG Game - Status Screen">
  <meta name="theme-color" content="#0b0b19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>RPG Game</title>

  <!-- TailwindCSS v4 Browser CDN -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Google Fonts: DotGothic16 + Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

  <!-- Tailwind v4 Theme + Custom Styles -->
  <style type="text/tailwindcss">
    /* ─── Custom Theme ──────────────────────────────── */
    @theme {
      --font-sans: 'DotGothic16', system-ui, sans-serif;
    }

    /* ─── Base Styles ───────────────────────────────── */
    * {
      -webkit-tap-highlight-color: transparent;
    }

    html {
      overflow: hidden;
    }

    body {
      font-family: 'DotGothic16', system-ui, sans-serif;
      background-color: #0b0b19;
      color: #e5e7eb;
      margin: 0;
      padding: 0;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ─── Subtle Grid Background ────────────────────── */
    #app {
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* ─── Custom Scrollbar ──────────────────────────── */
    ::-webkit-scrollbar {
      width: 3px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* ─── Status Bar Fill Animation ─────────────────── */
    .status-bar-fill {
      animation: bar-fill 1s ease-out forwards;
    }

    @keyframes bar-fill {
      from { width: 0%; }
    }

    /* ─── Character Card Entrance ───────────────────── */
    .char-card {
      animation: card-in 0.4s ease-out both;
    }
    .char-card:nth-child(1) { animation-delay: 0.05s; }
    .char-card:nth-child(2) { animation-delay: 0.1s; }
    .char-card:nth-child(3) { animation-delay: 0.15s; }
    .char-card:nth-child(4) { animation-delay: 0.2s; }

    @keyframes card-in {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ─── Material Symbols Sizing ───────────────────── */
    .material-symbols-outlined {
      font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24;
    }

    /* ─── Modal Animations ─────────────────────────── */
    @keyframes fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes slide-up {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ─── Reduced Motion Preference ────────────────── */
    @media (prefers-reduced-motion: reduce) {
      .animate-pulse { animation: none !important; }
    }
  </style>

  <!-- App Module -->
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
